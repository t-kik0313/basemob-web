<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>規定打席</title>
    <style>
        body { margin: 0; background: #f4f7fb; color: #1f2937; font-family: "Segoe UI", sans-serif; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
        a.back { display: inline-block; margin-bottom: 16px; background: #1a3c8d; color: #fff; text-decoration: none; font-weight: bold; padding: 8px 14px; border-radius: 6px; }
        h1 { margin: 0 0 8px; color: #1a3c8d; }
        p.note { margin: 0 0 18px; line-height: 1.6; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="number"] { width: 140px; padding: 10px; border: 1px solid #d7e3f4; border-radius: 6px; font-size: 1.1rem; box-sizing: border-box; }
        button { margin-top: 16px; background: #1a3c8d; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-weight: bold; cursor: pointer; }
        .error { background: #fdecea; color: #b71c1c; border-radius: 6px; padding: 10px 12px; margin: 0 0 16px; }
        .saved { background: #e8f6ee; color: #1b5e20; border-radius: 6px; padding: 10px 12px; margin: 0 0 16px; }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="{{ url_for('players') }}">◀ 選手一覧へ戻る</a>
        <h1>規定打席</h1>
        <p class="note">チームの試合数にこの数をかけ、端数を切り上げた打席数を規定打席にします。</p>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% if saved %}<p class="saved">保存しました。</p>{% endif %}
        <form method="post">
            <label for="pa_coef">1試合あたりの規定打席</label>
            <input type="number" id="pa_coef" name="pa_coef" min="0.1" max="20" step="0.1" value="{{ '%g'|format(pa_coef) }}" required>
            <button type="submit">保存する</button>
        </form>
    </div>
</body>
</html>
