<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選手一覧</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .player-list-card {
            background: #d1e0f0;
            border: 3px solid #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow:
                0 0 0 5px rgba(26, 46, 89, 0.8),
                0 8px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            color: #2c3e50;
            position: relative;
            overflow: hidden;
            background-image:
                linear-gradient(135deg, #d1e0f0 0%, #a0c4e4 100%),
                radial-gradient(circle, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: auto, 40px 40px;
        }
        .top-menu-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(to right, #007BFF, #66b3ff);
            padding: 8px 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 3px solid #fff;
            box-shadow: 0 0 0 3px rgba(26, 46, 89, 0.8), 0 5px 10px rgba(0, 0, 0, 0.3);
        }
        .top-menu-bar .menu-item {
            color: #fff;
            text-decoration: none;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .top-menu-bar .menu-item.active {
            background-color: #004d99;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }
        .top-menu-bar { position: relative; z-index: 5; }
        .menu-dropdown { position: relative; }
        .menu-dropdown::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            height: 12px;
        }
        .menu-dropdown-toggle {
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }
        .menu-dropdown-panel {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 190px;
            margin: 0;
            padding: 0;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            z-index: 6;
        }
        .menu-dropdown-panel a {
            display: block;
            padding: 14px 18px;
            color: #1a2e59;
            text-decoration: none;
            text-shadow: none;
            font-weight: bold;
            border-bottom: 1px solid rgba(26, 46, 89, 0.16);
        }
        .menu-dropdown-panel a:last-child { border-bottom: none; }
        .menu-dropdown-panel a:hover,
        .menu-dropdown-panel a:focus { background: rgba(0, 123, 255, 0.12); }
        @media (hover: hover) and (pointer: fine) {
            .menu-dropdown:hover .menu-dropdown-panel,
            .menu-dropdown:focus-within .menu-dropdown-panel { display: block; }
        }
        .menu-dropdown.is-open .menu-dropdown-panel { display: block; }
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }
        .player-card {
            background-color: #f0f8ff;
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 0 0 3px rgba(26, 46, 89, 0.8), 2px 2px 5px rgba(0, 0, 0, 0.3);
            text-align: center;
            text-decoration: none;
            color: #2c3e50;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .player-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .player-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #fff;
            object-fit: contain;
            background-color: #e0e0e0;
        }
        .player-card h3 {
            margin: 10px 0 5px;
            font-size: 1.2em;
        }
        .player-card p {
            margin: 0;
            font-size: 0.9em;
        }
        /* 以下の2行を追加または修正してください */
        body { display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="player-list-card">
        <!-- 上部メニューバー -->
        <div class="top-menu-bar">
            <a href="{{ url_for('players') }}" class="menu-item active">選手一覧</a>
            <a href="{{ url_for('teamstats') }}" class="menu-item">チーム成績</a>
            <a href="{{ url_for('annual_stats_detail') }}" class="menu-item">個人成績</a>
            <!-- 🌟 ここに追加：成績入力（別タブで開くようにしています！） 🌟 -->
            <a href="{{ score_entry_url }}" target="_blank" rel="noopener noreferrer" class="menu-item">成績入力</a>
            <a href="{{ url_for('schedule') }}" class="menu-item">スケジュール</a>
            <a href="{{ url_for('events') }}" class="menu-item">イベント</a>
            <div class="menu-dropdown">
                <button type="button" class="menu-item menu-dropdown-toggle" aria-expanded="false" aria-haspopup="true">設定</button>
                <div class="menu-dropdown-panel">
                    <a href="{{ url_for('register_player') }}">選手登録</a>
                    <a href="{{ url_for('qualitative_abilities') }}">特殊能力設定</a>
                    <a href="{{ url_for('regulation_settings') }}">規定打席</a>
                </div>
            </div>
        </div>

        <h1 class="text-stroke-blue" style="text-align: center;">選手一覧</h1>
        
        <div class="players-grid">
            {% for player in players %}
            <a href="{{ url_for('player_detail_R1', player_id=player['player_id']) }}" class="player-card">
                <img src="{{ url_for('static', filename=player['image_path']) }}" alt="{{ player['name'] }}" class="player-image">
                <div class="player-info">
                    <h3>{{ player['name'] }}</h3>
                    <p># {{ player['no'] }}</p>
                </div>
            </a>
            {% endfor %}
        </div>

    </div>
    <script>
        (function () {
            var dropdown = document.querySelector('.menu-dropdown');
            if (!dropdown) return;
            var toggle = dropdown.querySelector('.menu-dropdown-toggle');
            var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
            toggle.addEventListener('click', function () {
                if (finePointer.matches) return;
                var open = dropdown.classList.toggle('is-open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
            document.addEventListener('click', function (event) {
                if (dropdown.contains(event.target)) return;
                dropdown.classList.remove('is-open');
                toggle.setAttribute('aria-expanded', 'false');
            });
        })();
    </script>
</body>
</html>
