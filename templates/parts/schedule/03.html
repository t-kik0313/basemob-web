            <div class="form-group"><label>住所</label><input type="text" id="f-address"></div>
        </div>

        <div class="form-group">
            <label>スタメン</label>
            <div class="lineup-editor" id="lineup-fields"></div>
        </div>

        <div class="form-group"><label>備考</label><textarea id="f-bench" rows="2"></textarea></div>
        <button class="btn-submit" onclick="saveEvent()">保存する</button>
        <button id="cancel-edit" style="display:none; width:100%; margin-top:10px; padding:10px; background:#ddd; border:none; color:#333 !important; font-weight:bold;" onclick="resetForm()">キャンセル</button>
        <button id="delete-event" style="width:100%; margin-top:10px; padding:10px; background:#dc3545; color:white !important; border:none; font-weight:bold;" onclick="deleteEvent()">削除する</button>
    </div>
    <div id="schedule-past"></div>
</div>
<div id="pending-date-modal" hidden>
    <div class="pending-date-panel">
        <p id="pending-date-label"></p>
        <input id="pending-date-input" type="text" placeholder="例: 3/10" autocomplete="off">
        <div class="pending-date-actions">
            <button type="button" id="pending-date-ok">決定</button>
            <button type="button" id="pending-date-cancel">キャンセル</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

<script>
    const stadiums = { "大田スタジアム": "東京都大田区東海1-2-1", "多摩川緑地広場野球場": "東京都大田区本羽田3-29", "駒沢オリンピック公園総合運動場野球場": "東京都世田谷区駒沢公園1-1", "等々力球場": "神奈川県川崎市中原区等々力1-1", "世田谷公園野球場": "東京都世田谷区池尻1-5-27" };
    function autoFillAddr(v) { if (stadiums[v]) document.getElementById('f-address').value = stadiums[v]; }

    const eventNameChoices = ['公式戦', '練習試合', '練習'];
    function setEventName(value) {
        const select = document.getElementById('f-eventname');
        [...select.options].forEach(option => {
            if (option.value && !eventNameChoices.includes(option.value)) option.remove();
        });
        if (value && !eventNameChoices.includes(value)) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = value;
            select.appendChild(option);
        }
        select.value = value || '';
    }

    const roster = {{ roster | tojson }};
    const scheduleApi = {{ schedule_api | tojson }};

    function personName(value) {
        if (value && typeof value === 'object') return value.n || '';
        return value == null ? '' : String(value);
    }

    function playerIdFor(name) {
        const key = String(name || '').replace(/[\s\u3000]/g, '');
        if (!key) return null;
        const hit = roster.find(player => String(player.name || '').replace(/[\s\u3000]/g, '') === key);
        return hit && hit.player_id ? hit.player_id : null;
    }

    function stampPerson(name, extra) {
        const record = { n: name };
        if (extra) Object.assign(record, extra);
        const id = playerIdFor(name);
        if (id) record.player_id = id;
        return record;
    }
    const conditions = {{ conditions | tojson }};
    const conditionIcons = {
        '絶好調': {{ url_for('static', filename='condition_excellent.png') | tojson }},
        '好調': {{ url_for('static', filename='condition_good.png') | tojson }},
        '普通': {{ url_for('static', filename='condition_normal.png') | tojson }},
        '不調': {{ url_for('static', filename='condition_poor.png') | tojson }},
        '絶不調': {{ url_for('static', filename='condition_bad.png') | tojson }}
    };
    const positionColors = {
        '投': '#ff7eae', '捕': '#5ec8f5',
        '一': '#ffe14a', '二': '#ffe14a', '三': '#ffe14a', '遊': '#ffe14a',
        '左': '#7ed957', '中': '#7ed957', '右': '#7ed957',
        'DH': '#ffb020'
    };

    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function conditionSrc(name) {
        const text = conditions[name] || '普通';
        return conditionIcons[text] || conditionIcons['普通'];
    }

    function renderLineup(lineup) {
        const slots = [];
        for (let i = 0; i < 10; i++) slots.push((lineup || [])[i] || { n: '', p: '' });
        const hasDh = slots.slice(0, 9).some(row => row.p === 'DH');
        return '<div class="pp-order">' + slots.map((row, i) => {
            const orderNo = (i === 9 && hasDh) ? 'P' : String(i + 1);
            const color = positionColors[row.p] || '#c5ced6';
            const face = row.n ? '<img class="pp-face" src="' + conditionSrc(row.n) + '" alt="">' : '<span class="pp-face"></span>';
            return '<div class="pp-row">' +
                '<span class="pp-num">' + orderNo + '</span>' +
                '<span class="pp-name" style="background:' + color + '">' + esc(row.n) + '</span>' +
                face +
                '<span class="pp-pos" style="background:' + color + '">' + esc(row.p) + '</span>' +
            '</div>';
        }).join('') + '</div>';
    }
    const posOptions = ["投","捕","一","二","三","遊","左","中","右","DH"];
    const lineupContainer = document.getElementById('lineup-fields');
    for (let i = 1; i <= 10; i++) {
        lineupContainer.innerHTML += `
            <div class="lineup-row">
                <span id="p-order-${i}">${i}</span>
                <div class="name-field">
                    <select id="p-name-${i}"></select>
                    <input type="text" id="p-name-manual-${i}" class="name-manual" placeholder="選手名を入力" hidden>
                </div>
                <select id="p-pos-${i}">
                    <option value="">位置</option>
                    ${posOptions.map(p => `<option value="${p}">${p}</option>`).join('')}
                </select>
            </div>`;
    }

    const manualNameValue = '__manual__';

    function manualNameInput(select) {
        return document.getElementById(select.id.replace('p-name-', 'p-name-manual-'));
    }

    function fillNameSelect(select, current) {
        const names = roster.map(player => player.name).filter(Boolean);
        const typed = current && !names.includes(current);
        select.innerHTML = '<option value="">選手名</option><option value="' + manualNameValue + '">手入力</option>';
        names.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            select.appendChild(option);
        });
        const input = manualNameInput(select);
        if (typed) {
            select.value = manualNameValue;
            input.hidden = false;
            input.value = current;
        } else {
            select.value = current || '';
            input.hidden = true;
            input.value = '';
        }
    }

    function syncManualName(select) {
        const input = manualNameInput(select);
        if (select.value === manualNameValue) {
            input.hidden = false;
            input.focus();
        } else {
            input.hidden = true;
            input.value = '';
        }
    }

    function lineupName(index) {
        const select = document.getElementById(`p-name-${index}`);
        if (select.value === manualNameValue) return manualNameInput(select).value.trim();
        return select.value;
    }

    function lineupHasDh() {
        for (let i = 1; i <= 9; i++) {
            const pos = document.getElementById(`p-pos-${i}`);
            if (pos && pos.value === 'DH') return true;
        }
        return false;
    }

    function syncTenth() {
        const order = document.getElementById('p-order-10');
        const pos = document.getElementById('p-pos-10');
        if (!order || !pos) return;
        if (lineupHasDh()) {
            order.textContent = '';
            pos.value = '投';
            pos.disabled = true;
        } else {
            order.textContent = '10';
            pos.disabled = false;
        }
    }

    for (let i = 1; i <= 10; i++) {
        const nameSelect = document.getElementById(`p-name-${i}`);
        fillNameSelect(nameSelect, '');
        nameSelect.addEventListener('change', () => syncManualName(nameSelect));
        if (i <= 9) document.getElementById(`p-pos-${i}`).addEventListener('change', syncTenth);
    }

    let events = [];

    async function loadFromServer() {
        try {
            const res = await fetch(scheduleApi);
            const data = await res.json();
            if (Array.isArray(data)) events = data;
            render();
        } catch (e) {
            console.error("読み込みエラー:", e);
        }
    }

    async function updateToServer() {
        try {
            await fetch(scheduleApi, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(events)
            });
            render();
        } catch (e) {
            console.error("保存エラー:", e);
        }
    }

    function snapTo5(input) {
        if (!input.value) return;
        let [hh, mm] = input.value.split(':');
        mm = Math.floor(parseInt(mm) / 5) * 5;
        input.value = `${hh}:${mm.toString().padStart(2, '0')}`;
    }

    window.addEventListener('DOMContentLoaded', loadFromServer);

    function saveEvent() {
        const idx = document.getElementById('edit-index').value;
        const lineupData = [];
        syncTenth();
        for (let i = 1; i <= 10; i++) {
            lineupData.push(stampPerson(lineupName(i), { p: document.getElementById(`p-pos-${i}`).value }));
        }

        const newEvent = {
            date: document.getElementById('f-date').value,
            eventName: document.getElementById('f-eventname').value,
            opponent: document.getElementById('f-opponent').value,
            uniform: document.getElementById('f-uniform').value,
            bat: document.getElementById('f-bat').value,
            timeGather: document.getElementById('f-time-gather').value,
            timePB: document.getElementById('f-time-pb').value,
            stadium: document.getElementById('f-stadium').value,
            address: document.getElementById('f-address').value,
            lineup: lineupData,
            bench: document.getElementById('f-bench').value,
            attendees: idx !== "" ? events[idx].attendees : [],
            absentees: idx !== "" ? events[idx].absentees : [],
            pendings: idx !== "" && events[idx].pendings ? events[idx].pendings : [],
            editedFields: []
        };

        if (idx !== "") {
            const old = events[idx];
            for (let k in newEvent) {
                if(k === 'lineup') {
                    if(JSON.stringify(newEvent.lineup) !== JSON.stringify(old.lineup)) newEvent.editedFields.push('lineup');
                } else if (!['editedFields','attendees','absentees','pendings'].includes(k) && newEvent[k] !== (k === 'bat' ? (old[k] || '使用可能バット情報なし') : old[k])) {
