<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選手登録</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .player-list-card {
            background: #d1e0f0;
            border: 3px solid #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow:
                0 0 0 5px rgba(26, 46, 89, 0.8),
                0 8px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
            color: #2c3e50;
            position: relative;
            overflow: hidden;
            background-image:
                linear-gradient(135deg, #d1e0f0 0%, #a0c4e4 100%),
                radial-gradient(circle, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: auto, 40px 40px;
        }
        .top-menu-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: space-around;
            align-items: center;
            background: linear-gradient(to right, #007BFF, #66b3ff);
            padding: 8px 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 3px solid #fff;
            box-shadow: 0 0 0 3px rgba(26, 46, 89, 0.8), 0 5px 10px rgba(0, 0, 0, 0.3);
        }
        .top-menu-bar .menu-item {
            color: #fff;
            text-decoration: none;
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .top-menu-bar .menu-item.active {
            background-color: #004d99;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.5);
        }
        .top-menu-bar { position: relative; z-index: 5; }
        .menu-dropdown { position: relative; }
        .menu-dropdown::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            height: 12px;
        }
        .menu-dropdown-toggle {
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }
        .menu-dropdown-panel {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 190px;
            margin: 0;
            padding: 0;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 8px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
            overflow: hidden;
            z-index: 6;
        }
        .menu-dropdown-panel a {
            display: block;
            padding: 14px 18px;
            color: #1a2e59;
            text-decoration: none;
            text-shadow: none;
            font-weight: bold;
            border-bottom: 1px solid rgba(26, 46, 89, 0.16);
        }
        .menu-dropdown-panel a:last-child { border-bottom: none; }
        .menu-dropdown-panel a.active { background: rgba(0, 77, 153, 0.12); }
        .menu-dropdown-panel a:hover,
        .menu-dropdown-panel a:focus { background: rgba(0, 123, 255, 0.12); }
        @media (hover: hover) and (pointer: fine) {
            .menu-dropdown:hover .menu-dropdown-panel,
            .menu-dropdown:focus-within .menu-dropdown-panel { display: block; }
        }
        .menu-dropdown.is-open .menu-dropdown-panel { display: block; }
        body { display: flex; flex-direction: column; align-items: center; }
        .register-panel {
            background: #f0f8ff;
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 0 3px rgba(26, 46, 89, 0.8), 2px 2px 5px rgba(0, 0, 0, 0.3);
            max-width: 560px;
            margin: 0 auto;
        }
        .form-error {
            background: #fff3f3;
            color: #9b1c1c;
            border: 1px solid #f0b4b4;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 16px;
            font-weight: bold;
        }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #1a2e59;
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #9bb6d4;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background: #fff;
            color: #2c3e50;
        }
        .hand-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .file-field input[type="file"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            background: #fff;
            border: 1px solid #9bb6d4;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .file-hint {
            margin: 6px 0 0;
            font-size: 0.85rem;
            color: #3d5166;
        }
        .image-preview {
            width: 96px;
            height: 96px;
            margin-top: 10px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            background: #e0e0e0;
            box-shadow: 0 0 0 3px rgba(26, 46, 89, 0.8);
        }
        .image-preview[hidden] { display: none; }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .form-actions .btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        .form-actions .btn-primary {
            background: #004d99;
            color: #fff;
        }
        .form-actions .btn-primary:hover { background: #003366; }
        .form-actions .btn-secondary {
            background: #d7e3f0;
            color: #1a2e59;
        }
        .form-actions .btn-secondary:hover { background: #c5d5e8; }
        @media (max-width: 640px) {
            .hand-row { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column; }
            .top-menu-bar .menu-item { font-size: 0.85rem; padding: 5px 10px; }
        }
    </style>
</head>
<body>
    <div class="player-list-card">
        <div class="top-menu-bar">
            <a href="{{ url_for('players') }}" class="menu-item">選手一覧</a>
            <a href="{{ url_for('teamstats') }}" class="menu-item">チーム成績</a>
            <a href="{{ url_for('annual_stats_detail') }}" class="menu-item">個人成績</a>
            <a href="{{ score_entry_url }}" target="_blank" rel="noopener noreferrer" class="menu-item">成績入力</a>
            <a href="{{ url_for('schedule') }}" class="menu-item">スケジュール</a>
            <div class="menu-dropdown">
                <button type="button" class="menu-item menu-dropdown-toggle active" aria-expanded="false" aria-haspopup="true">設定</button>
                <div class="menu-dropdown-panel">
                    <a href="{{ url_for('register_player') }}" class="active">選手登録</a>
                    <a href="{{ url_for('qualitative_abilities') }}">特殊能力設定</a>
                </div>
            </div>
        </div>

        <h1 class="text-stroke-blue" style="text-align: center;">選手登録</h1>

        <div class="register-panel">
            {% if error %}
            <p class="form-error">{{ error }}</p>
            {% endif %}
            <form action="{{ url_for('register_player') }}" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">選手名</label>
                    <input type="text" id="name" name="name" value="{{ form.name|default('', true) }}" required>
                </div>
                <div class="form-group">
                    <label for="number">背番号</label>
                    <input type="number" id="number" name="number" value="{{ form.number|default('', true) }}" required>
                </div>
                <div class="form-group">
                    <label for="position">守備位置</label>
                    <input type="text" id="position" name="position" value="{{ form.position|default('', true) }}">
                </div>
                <div class="hand-row">
                    <div class="form-group">
                        <label for="throw_hand">投</label>
                        <select id="throw_hand" name="throw_hand" required>
                            {% for hand in ['右', '左', '両'] %}
                            <option value="{{ hand }}" {% if form.throw_hand == hand %}selected{% endif %}>{{ hand }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="bat_hand">打</label>
                        <select id="bat_hand" name="bat_hand" required>
                            {% for hand in ['右', '左', '両'] %}
                            <option value="{{ hand }}" {% if form.bat_hand == hand %}selected{% endif %}>{{ hand }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group file-field">
                    <label for="image">画像</label>
                    <input type="file" id="image" name="image" accept="image/jpeg,image/png,image/webp,image/gif">
                    <p class="file-hint">パソコンのフォルダ、またはスマホの画像フォルダから選べます。</p>
                    <img id="image-preview" class="image-preview" alt="選択した画像のプレビュー" hidden>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">登録</button>
                    <a href="{{ url_for('players') }}" class="btn btn-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('image').addEventListener('change', function () {
            const preview = document.getElementById('image-preview');
            const file = this.files && this.files[0];
            if (!file) {
                preview.hidden = true;
                preview.removeAttribute('src');
                return;
            }
            preview.src = URL.createObjectURL(file);
            preview.hidden = false;
        });
        (function () {
            var dropdown = document.querySelector('.menu-dropdown');
            if (!dropdown) return;
            var toggle = dropdown.querySelector('.menu-dropdown-toggle');
            var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
            toggle.addEventListener('click', function () {
                if (finePointer.matches) return;
                var open = dropdown.classList.toggle('is-open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            });
            document.addEventListener('click', function (event) {
                if (dropdown.contains(event.target)) return;
                dropdown.classList.remove('is-open');
                toggle.setAttribute('aria-expanded', 'false');
            });
        })();
    </script>
</body>
</html>
